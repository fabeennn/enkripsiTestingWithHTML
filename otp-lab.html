<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enkripsi Teks | OTP Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="otp-lab.css">
</head>
<body>
  <header class="judul">
    <h1>Enkripsi<br>Teks</h1>
    <p class="sub">Tulis pesan, pilih algoritma, ambil hasilnya sebagai file .txt.</p>
  </header>

  <main class="grid">
    <section class="kartu" aria-labelledby="h-input">
      <h2 id="h-input">Input</h2>

      <div class="grup">
        <span class="label" id="l-mode">Mode</span>
        <div class="toggle" role="radiogroup" aria-labelledby="l-mode">
          <input type="radio" name="mode" id="mode-enk" value="enkripsi" checked>
          <label for="mode-enk">Enkripsi</label>
          <input type="radio" name="mode" id="mode-dek" value="dekripsi">
          <label for="mode-dek">Dekripsi</label>
        </div>
      </div>

      <div class="grup">
        <label class="label" for="teks">Teks</label>
        <textarea id="teks" rows="7" placeholder="Ketik atau tempel teks di sini..."></textarea>
        <div class="baris">
          <label class="tombol kecil" for="file-teks">Muat file .txt</label>
          <input type="file" id="file-teks" accept=".txt,text/plain" hidden>
          <span class="hitung" id="hitung">0 karakter</span>
        </div>
      </div>

      <div class="grup">
        <label class="label" for="metode">Algoritma</label>
        <select id="metode"></select>
      </div>

      <div class="grup">
        <label class="label" for="kunci">Kunci</label>
        <input type="text" id="kunci" autocomplete="off" spellcheck="false">
        <p class="petunjuk" id="petunjuk"></p>
      </div>

      <button class="tombol besar" id="proses" type="button">Enkripsi</button>
      <p class="galat" id="galat" role="alert" hidden></p>
    </section>

    <section class="kartu gelap" aria-labelledby="h-output">
      <h2 id="h-output">Output</h2>

      <div class="grup">
        <label class="label" for="hasil">Hasil</label>
        <textarea id="hasil" rows="7" readonly placeholder="Hasil muncul di sini."></textarea>
      </div>

      <div class="grup" id="blok-kunci" hidden>
        <label class="label" for="kunci-hasil">Kunci OTP (simpan, dibutuhkan untuk dekripsi)</label>
        <textarea id="kunci-hasil" rows="3" readonly></textarea>
      </div>

      <p class="statistik" id="statistik" hidden></p>
      <p class="catatan" id="catatan" hidden>Algoritma klasik hanya memproses huruf A-Z. Spasi, angka, dan tanda baca dibuang, sedangkan Playfair dan Hill bisa menambah huruf X sebagai pengisi.</p>

      <div class="baris rapat">
        <button class="tombol" id="salin" type="button" disabled>Salin</button>
        <button class="tombol" id="unduh" type="button" disabled>Unduh .txt</button>
        <button class="tombol" id="unduh-kunci" type="button" hidden>Unduh kunci .txt</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
